services:
  - type: web
    name: yoga-upi-backend
    runtime: node
    rootDir: upi-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: REGISTRATION_FEE
        sync: false
      - key: UPI_ID
        sync: false
      - key: UPI_PAYEE_NAME
        sync: false
      - key: CHECKIN_TOKEN_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_APP_PASSWORD
        sync: false
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
